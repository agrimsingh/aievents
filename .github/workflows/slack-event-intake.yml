name: Slack event intake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: slack-event-intake
  cancel-in-progress: false

jobs:
  collect-approved-events:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      change_count: ${{ steps.intake.outputs.change_count }}
      events_b64: ${{ steps.payload.outputs.events_b64 }}
      new_pr: ${{ steps.branch.outputs.new_pr }}
      pr_number: ${{ steps.branch.outputs.pr_number }}
      summary_b64: ${{ steps.payload.outputs.summary_b64 }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate repository configuration
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_EVENT_APPROVER_IDS: ${{ vars.SLACK_EVENT_APPROVER_IDS }}
          SLACK_EVENT_CHANNEL_ID: ${{ vars.SLACK_EVENT_CHANNEL_ID }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
        run: |
          if [[ -z "$SLACK_BOT_TOKEN" ]]; then
            echo "::error::Missing the SLACK_BOT_TOKEN Actions secret"
            exit 1
          fi
          if [[ -z "$SLACK_EVENT_CHANNEL_ID" ]]; then
            echo "::error::Missing the SLACK_EVENT_CHANNEL_ID repository variable"
            exit 1
          fi
          if [[ -z "$SLACK_EVENT_APPROVER_IDS" ]]; then
            echo "::error::Missing the SLACK_EVENT_APPROVER_IDS repository variable"
            exit 1
          fi
          if [[ -z "$SLACK_TEAM_ID" ]]; then
            echo "::error::Missing the SLACK_TEAM_ID repository variable"
            exit 1
          fi

      - name: Run intake unit tests
        run: node --test scripts/*.test.mjs

      - name: Locate a trusted open intake pull request
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp data/slack-events.json "$RUNNER_TEMP/slack-events-main.json"
          existing_pr="$(gh pr list --base main --state open --limit 100 --json author,headRefName,number --jq '.[] | select((.author.login == "app/github-actions" or .author.login == "github-actions[bot]") and (.headRefName | startswith("automation/slack-event-intake-"))) | [.number, .headRefName] | @tsv' | head -n 1)"

          if [[ -n "$existing_pr" ]]; then
            pr_number="${existing_pr%%$'\t'*}"
            branch="${existing_pr#*$'\t'}"
            if [[ ! "$branch" =~ ^automation/slack-event-intake-[0-9]+$ ]]; then
              echo "::error::Unexpected intake branch name"
              exit 1
            fi
            git fetch origin "$branch"
            unexpected_files="$(git diff --name-only "origin/main...origin/$branch" | grep -v '^data/slack-events.json$' || true)"
            if [[ -n "$unexpected_files" ]]; then
              echo "::error::The intake PR changes files outside data/slack-events.json"
              exit 1
            fi
            git show "origin/$branch:data/slack-events.json" > data/slack-events.json
            echo "new_pr=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          else
            branch="automation/slack-event-intake-${GITHUB_RUN_ID}"
            echo "new_pr=true" >> "$GITHUB_OUTPUT"
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Collect approved event URLs
        id: intake
        env:
          INTAKE_SUMMARY_PATH: ${{ runner.temp }}/slack-event-intake.md
          SLACK_EVENT_BASE_DATA_PATH: ${{ runner.temp }}/slack-events-main.json
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_EVENT_APPROVAL_REACTIONS: ${{ vars.SLACK_EVENT_APPROVAL_REACTIONS || 'white_check_mark' }}
          SLACK_EVENT_APPROVER_IDS: ${{ vars.SLACK_EVENT_APPROVER_IDS }}
          SLACK_EVENT_CHANNEL_ID: ${{ vars.SLACK_EVENT_CHANNEL_ID }}
          SLACK_EVENT_LOOKBACK_DAYS: ${{ vars.SLACK_EVENT_LOOKBACK_DAYS || '30' }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
        run: node scripts/slack-event-intake.mjs

      - name: Encode the validated write payload
        id: payload
        if: steps.intake.outputs.change_count != '0'
        run: |
          echo "events_b64=$(base64 -w 0 data/slack-events.json)" >> "$GITHUB_OUTPUT"
          echo "summary_b64=$(base64 -w 0 "$RUNNER_TEMP/slack-event-intake.md")" >> "$GITHUB_OUTPUT"

  write-review-pr:
    needs: collect-approved-events
    if: needs.collect-approved-events.outputs.change_count != '0'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Decode the validated collector payload
        env:
          EVENTS_B64: ${{ needs.collect-approved-events.outputs.events_b64 }}
          SUMMARY_B64: ${{ needs.collect-approved-events.outputs.summary_b64 }}
        run: |
          printf '%s' "$EVENTS_B64" | base64 --decode > "$RUNNER_TEMP/slack-events.json"
          printf '%s' "$SUMMARY_B64" | base64 --decode > "$RUNNER_TEMP/slack-event-intake.md"

      - name: Prepare the review branch
        env:
          BRANCH: ${{ needs.collect-approved-events.outputs.branch }}
          EXISTING_PR: ${{ needs.collect-approved-events.outputs.new_pr == 'false' }}
        run: |
          if [[ ! "$BRANCH" =~ ^automation/slack-event-intake-[0-9]+$ ]]; then
            echo "::error::Unexpected intake branch name"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$EXISTING_PR" == "true" ]]; then
            git fetch origin "$BRANCH"
            unexpected_files="$(git diff --name-only "origin/main...origin/$BRANCH" | grep -v '^data/slack-events.json$' || true)"
            if [[ -n "$unexpected_files" ]]; then
              echo "::error::The intake PR changes files outside data/slack-events.json"
              exit 1
            fi
            git switch --force-create "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git switch --create "$BRANCH"
          fi

          cp "$RUNNER_TEMP/slack-events.json" data/slack-events.json

      - name: Commit and push the event data
        env:
          BRANCH: ${{ needs.collect-approved-events.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git add data/slack-events.json
          git commit -m "chore(events): sync Slack-approved events"
          git push --set-upstream origin "$BRANCH"

      - name: Open the review pull request
        if: needs.collect-approved-events.outputs.new_pr == 'true'
        env:
          BRANCH: ${{ needs.collect-approved-events.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(events): sync Slack-approved events" \
            --body-file "$RUNNER_TEMP/slack-event-intake.md"

      - name: Note changes on the existing pull request
        if: needs.collect-approved-events.outputs.new_pr == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.collect-approved-events.outputs.pr_number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/slack-event-intake.md"
